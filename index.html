<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="img/logo-rgk-icono-64.png?v=10">
<link rel="apple-touch-icon" href="img/logo-rgk-icono-180.png?v=10">
<meta name="description" content="Versión de prueba de RGK Santafesino: inscripciones, tiempos y resultados de torneos de karting.">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>RGK Santafesino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior tipo "pit board" + columna central de 1120px; tablas como planillas de cronometraje.
   Identidad RGK Santafesino: negro y rojo, con un fondo de figuras de karting en contorno (img/fondo-wire.svg, generado con tools/generar-fondo.py). */
:root {
  --bg: #0a0a0b;
  --surface: #18181b;
  --surface-2: #222226;
  --ink: #f3f3f2;
  --ink-2: #b9b9bd;
  --ink-3: #85858c;
  --line: #2e2e33;
  --accent: #d7141c;        /* rojo RGK */
  --accent-ink: #ffffff;
  --accent-text: #ff4b52;   /* rojo para texto sobre negro */
  --track: #ff6a70;         /* links y foco */
  --ok: #5fd08a;
  --ok-bg: #173623;
  --warn: #f2b84b;
  --warn-bg: #3a2c10;
  --danger: #ff8a80;
  --danger-bg: #3d1a17;
  --inv: #ffd166;
  --inv-bg: #3b3011;
  --bar: #000000;
  --bar-ink: #f3f3f2;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.45);
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
/* Fondo de atrás: figuras de karting rojas en 3D sobre oscuro, con viñeta. Fijo detrás del contenido. */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 120% 90% at 50% 40%, transparent 40%, rgba(0,0,0,.65) 100%), url("img/fondo-wire.svg?v=3") 0 0 / 800px 800px repeat, #0c0b0d; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 2.1rem; font-weight: 800; text-transform: uppercase; }
h2 { font-size: 1.4rem; font-weight: 700; text-transform: uppercase; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--track); }
:focus-visible { outline: 2px solid var(--track); outline-offset: 2px; }
.mono, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.eyebrow { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; color: var(--accent-text); }

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); border-bottom: 3px solid var(--accent); }
.topbar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand img { display: block; height: 72px; width: auto; }
@media (max-width: 640px) { .brand img { height: 58px; } }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 1.25rem; letter-spacing: .04em; }
.topnav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
.topnav a { color: var(--bar-ink); opacity: .75; text-decoration: none; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: .9rem; padding: 6px 10px; border-radius: 4px; white-space: nowrap; }
.topnav a:hover { opacity: 1; }
.topnav a[aria-current="page"] { opacity: 1; background: var(--accent); color: var(--accent-ink); }

.demo-banner { background: var(--warn-bg); color: var(--warn); font-size: .88rem; }
.demo-banner .wrap { padding-block: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Contenido */
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* Primer fondo: panel oscuro sombreado donde van todos los casilleros; deja ver apenas las figuras de atrás */
main.wrap { width: calc(100% - 32px); margin: 24px auto 56px; padding: 28px 24px 56px; border-radius: 16px;
  background: linear-gradient(160deg, rgba(34,34,38,.68) 0%, rgba(10,10,12,.76) 50%, rgba(0,0,0,.84) 100%);
  border: 1px solid rgba(255,255,255,.07); box-shadow: 0 24px 70px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  }
@media (max-width: 640px) {
  main.wrap { width: calc(100% - 20px); margin: 14px auto 40px; padding: 20px 14px 44px; border-radius: 12px; }
  body::after { background-size: auto, 560px 560px, auto; }
}
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid > *, .stack > *, .row > * { min-width: 0; }
.page-head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; border-bottom: 3px solid var(--accent); padding-bottom: 12px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); text-decoration: none; font-size: .9rem; }
.back:hover { color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card-flat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.section-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.empty { background: rgba(21,21,23,.85); border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 28px 18px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Botones */
.btn { font: 600 .95rem/1 var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; min-height: 40px; }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: #ef1f28; border-color: #ef1f28; }
.btn-dark { background: #000; border-color: var(--accent); color: #fff; }
.btn-dark:hover { background: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn-danger { background: var(--surface); border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { background: var(--danger-bg); }
.btn-sm { padding: 6px 10px; min-height: 32px; font-size: .85rem; }
.btn-lg { padding: 14px 22px; min-height: 52px; font-size: 1.05rem; }

/* Formularios */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-weight: 600; font-size: .88rem; color: var(--ink-2); }
.field .hint { font-size: .8rem; color: var(--ink-3); }
.field .error { font-size: .8rem; color: var(--danger); }
input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  font: 400 1rem/1.3 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; min-height: 42px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--track); outline-offset: 0; border-color: var(--track); }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
.form-grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }

/* Tablas tipo planilla */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th { text-align: left; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; font-weight: 700; color: var(--ink-2);
  background: var(--surface-2); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.center, .tbl th.center { text-align: center; }
.tbl tr.pending td { color: var(--ink-3); font-style: italic; background: repeating-linear-gradient(-45deg, transparent 0 8px, var(--surface-2) 8px 16px); }
.tbl input[type="text"] { min-height: 34px; padding: 6px 8px; }
.kart-no { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 26px; padding: 0 6px; border-radius: 3px;
  background: var(--accent); color: var(--accent-ink); font: 700 .95rem/1 var(--font-display); font-variant-numeric: tabular-nums; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill-ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill-warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.pill-inv { background: var(--inv-bg); color: var(--inv); border-color: transparent; }
.pill-live { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pill-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .pill-live::before { animation: none; } }

/* Tabs de categorías */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font: 600 .95rem var(--font-display); text-transform: uppercase; letter-spacing: .05em; background: none; border: 0; border-bottom: 3px solid transparent;
  padding: 10px 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* Modal y toast */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); color: var(--ink); border-radius: 8px; width: min(640px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 32px); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: var(--shadow); font-size: .92rem; }
.toast.error { background: var(--danger); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }

.loading { color: var(--ink-3); padding: 40px 0; text-align: center; }

@media (max-width: 640px) {
  h1 { font-size: 1.7rem; }
  .topbar-in { flex-wrap: wrap; gap: 8px; }
  .topnav { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#inicio" id="brand"><img src="img/logo-rgk-144.png?v=11" alt="RGK Santafesino" width="202" height="144"></a>
    <nav class="topnav" id="topnav" aria-label="Secciones">
      <a href="#inicio" data-route="inicio">Inicio</a>
      <a href="#competidores" data-route="competidores">Competidores</a>
      <a href="#torneo-actual" data-route="torneo-actual">Torneo actual</a>
      <a href="#proximos-torneos" data-route="proximos-torneos">Próximos</a>
      <a href="#torneos-pasados" data-route="torneos-pasados">Pasados</a>
      <a href="#buscar" data-route="buscar">Buscar</a>
    </nav>
  </div>
</header>
<div class="demo-banner" id="demo-banner" hidden>
  <div class="wrap"><span id="demo-banner-text"></span></div>
</div>
<main class="wrap" id="app"><p class="loading">Cargando…</p></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
