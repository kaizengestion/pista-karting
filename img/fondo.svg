<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="720" viewBox="0 0 720 720">
  <!-- Fondo de la página: figuras de karting en rojo con relieve 3D (luz, brillo y extrusión). Se repite como mosaico. -->
  <defs>
    <filter id="relieve" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <!-- Volumen: luz desde arriba a la izquierda sobre el trazo -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="alto"/>
      <feSpecularLighting in="alto" surfaceScale="5" specularConstant="1.1" specularExponent="16" lighting-color="#ffd2d4" result="brillo">
        <feDistantLight azimuth="225" elevation="40"/>
      </feSpecularLighting>
      <feComposite in="brillo" in2="SourceAlpha" operator="in" result="brilloIn"/>
      <feDiffuseLighting in="alto" surfaceScale="5" diffuseConstant="1" lighting-color="#ffffff" result="luz">
        <feDistantLight azimuth="225" elevation="50"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="luz" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="sombreado"/>
      <feComposite in="sombreado" in2="brilloIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="frente"/>
      <!-- Extrusión: la cara de atrás, corrida hacia abajo a la derecha -->
      <feOffset in="SourceAlpha" dx="2" dy="2" result="o1"/>
      <feOffset in="SourceAlpha" dx="4" dy="4" result="o2"/>
      <feOffset in="SourceAlpha" dx="6" dy="6" result="o3"/>
      <feMerge result="prof"><feMergeNode in="o3"/><feMergeNode in="o2"/><feMergeNode in="o1"/></feMerge>
      <feFlood flood-color="#4d0207"/>
      <feComposite in2="prof" operator="in" result="lado"/>
      <!-- Sombra sobre el fondo -->
      <feOffset in="SourceAlpha" dx="9" dy="11" result="so"/>
      <feGaussianBlur in="so" stdDeviation="5" result="sb"/>
      <feFlood flood-color="#000000" flood-opacity=".75"/>
      <feComposite in2="sb" operator="in" result="sombra"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="lado"/><feMergeNode in="frente"/></feMerge>
    </filter>
    <g id="kart">
      <circle cx="34" cy="58" r="15"/><circle cx="34" cy="58" r="6"/>
      <circle cx="128" cy="60" r="12"/><circle cx="128" cy="60" r="5"/>
      <path d="M10 56 L18 48 H146 L154 56"/>
      <path d="M6 38 V62 M6 50 H18"/>
      <path d="M52 48 L60 38 H104 L112 48"/>
      <path d="M112 48 L136 42 Q150 42 156 50 L154 56"/>
      <path d="M50 48 L46 26 Q46 20 52 21 L58 38"/>
      <path d="M55 30 Q64 22 72 30 L86 25"/>
      <circle cx="60" cy="12" r="9"/><path d="M61 9 H69"/>
      <path d="M80 38 L88 22 M82 17 L95 26"/>
      <rect x="18" y="30" width="20" height="14" rx="2"/>
    </g>
    <g id="casco">
      <path d="M8 38 Q6 10 32 8 Q56 8 56 34 V44 Q56 50 50 50 H18 Q8 50 8 38 Z"/>
      <path d="M24 22 H54 L56 34 H28 Q22 34 22 28 Z"/>
      <path d="M10 43 H40"/>
    </g>
    <g id="volante">
      <circle cx="30" cy="30" r="26"/><circle cx="30" cy="30" r="19"/><circle cx="30" cy="30" r="6"/>
      <path d="M11 26 H24 M36 26 H49 M30 36 V49"/>
    </g>
    <g id="bandera">
      <path d="M4 2 V80"/>
      <path d="M4 6 Q20 0 36 6 T68 6 V38 Q52 32 36 38 T4 38 Z"/>
      <path d="M20 3 V35 M36 6 V38 M52 3 V35"/>
      <path d="M4 22 Q20 16 36 22 T68 22"/>
    </g>
    <g id="crono">
      <circle cx="30" cy="36" r="22"/>
      <path d="M24 8 H36 M30 8 V14 M47 18 L52 13"/>
      <path d="M30 36 L30 22 M30 36 L40 42"/>
    </g>
    <g id="cubierta">
      <circle cx="30" cy="30" r="27"/><circle cx="30" cy="30" r="14"/><circle cx="30" cy="30" r="5"/>
      <path d="M30 3 V9 M30 51 V57 M3 30 H9 M51 30 H57 M11 11 L15 15 M45 45 L49 49 M49 11 L45 15 M11 49 L15 45"/>
    </g>
    <g id="copa">
      <path d="M20 4 H44 V20 A12 12 0 0 1 20 20 Z"/>
      <path d="M44 8 H52 V13 A8 8 0 0 1 44 21 M20 8 H12 V13 A8 8 0 0 0 20 21"/>
      <path d="M32 32 V44 M22 50 H42 M26 44 H38 V50"/>
    </g>
    <g id="cono">
      <path d="M24 4 L8 50 H40 Z"/>
      <path d="M2 50 H46 V56 H2 Z"/>
      <path d="M15 30 H33 M19 18 H29"/>
    </g>
  </defs>
  <g fill="none" stroke="#e3101a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#relieve)">
    <use xlink:href="#kart" href="#kart" transform="translate(40 70) scale(1.5)"/>
    <path d="M6 150 H30 M2 166 H22 M12 182 H36"/>
    <use xlink:href="#casco" href="#casco" transform="translate(400 270) scale(1.4)"/>
    <use xlink:href="#crono" href="#crono" transform="translate(590 380) scale(1.2)"/>
    <use xlink:href="#cubierta" href="#cubierta" transform="translate(270 480) scale(1.2)"/>
    <use xlink:href="#cono" href="#cono" transform="translate(70 590) scale(1.1)"/>
    <use xlink:href="#bandera" href="#bandera" transform="translate(200 300) rotate(-10) scale(1.1)"/>
    <use xlink:href="#bandera" href="#bandera" transform="translate(540 40) rotate(12) scale(1.3)"/>
    <use xlink:href="#volante" href="#volante" transform="translate(70 330) scale(1.3)"/>
    <use xlink:href="#copa" href="#copa" transform="translate(480 560) scale(1.4)"/>
    <use xlink:href="#kart" href="#kart" transform="translate(470 176) scale(.95)"/>
    <path d="M438 214 H462 M444 228 H466"/>
    <use xlink:href="#casco" href="#casco" transform="translate(330 70) rotate(-8)"/>
  </g>
</svg>
